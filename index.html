<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ta Te Ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">

<body>

<main class="tarjeta">
  <h1>Ta <span class="x">Te</span> <span class="o">Ti</span></h1>
  <p class="subtitulo">versión 3 fichas</p>

  <div id="mensaje"></div>
  <div id="tablero"></div>
  <button id="reiniciar">↻ Jugar de nuevo</button>
</main>

<section id="reglas">
  <h2>Cómo se juega</h2>
  <p>
    Cada jugador tiene 3 fichas. Primero las colocan por turnos en casillas vacías.
    Cuando ya están las 6 en el tablero, se turnan para mover una ficha propia a una casilla vacía vecina.
    Gana quien arme una línea de 3.
  </p>
</section>

<script src="juego.js"></script>
